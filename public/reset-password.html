<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña | Tienda Virtual</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/standalone.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="standalone-wrapper">
        <div class="standalone-shape"></div>
        <div class="standalone-card">
            <i class="fa-solid fa-lock-open standalone-icon slide-element"></i>
            <h2 class="slide-element">Nueva contraseña</h2>
            <p class="standalone-text slide-element">Ingresa tu nueva contraseña para tu cuenta.</p>

            <div class="form-message" data-form="reset"></div>

            <form id="resetForm" novalidate>
                <div class="field-wrapper slide-element">
                    <input type="password" name="password" minlength="6" required>
                    <label>Nueva contraseña</label>
                    <i class="fa-solid fa-lock"></i>
                </div>

                <div class="field-wrapper slide-element">
                    <input type="password" name="confirmar" minlength="6" required>
                    <label>Confirmar contraseña</label>
                    <i class="fa-solid fa-lock"></i>
                </div>

                <div class="field-wrapper slide-element">
                    <button class="submit-button" type="submit">
                        <span class="btn-text">Restablecer</span>
                        <span class="btn-spinner" hidden></span>
                    </button>
                </div>
            </form>

            <div class="switch-link slide-element">
                <p><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Volver a iniciar sesión</a></p>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>Made with ❤️ by <a href="#" target="_blank">CodeZenithAI</a></p>
    </div>

    <script src="js/standalone.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.querySelector('.form-message[data-form="reset"]').textContent =
                'Enlace inválido: falta el token de recuperación.';
            document.querySelector('.form-message[data-form="reset"]').classList.add('error', 'show');
            document.getElementById('resetForm').querySelector('.submit-button').disabled = true;
        }

        new StandaloneForm({
            formId: 'resetForm',
            messageForm: 'reset',
            endpoint: '/api/auth/restablecer-password',
            validate: (datos) => {
                if (datos.password !== datos.confirmar) {
                    return 'Las contraseñas no coinciden.';
                }
                return null;
            },
            buildBody: (datos) => ({ token, password: datos.password }),
            onSuccess: (data, form) => {
                form.reset();
                setTimeout(() => { window.location.href = 'index.html'; }, 1500);
            }
        });
    </script>
</body>
</html>
