<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | Tienda Virtual</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/standalone.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="standalone-wrapper">
        <div class="standalone-shape"></div>
        <div class="standalone-card">
            <i class="fa-solid fa-key standalone-icon slide-element"></i>
            <h2 class="slide-element">Recuperar contraseña</h2>
            <p class="standalone-text slide-element">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>

            <div class="form-message" data-form="forgot"></div>

            <form id="forgotForm" novalidate>
                <div class="field-wrapper slide-element">
                    <input type="email" name="email" required>
                    <label>Correo electrónico</label>
                    <i class="fa-solid fa-envelope"></i>
                </div>

                <div class="field-wrapper slide-element">
                    <button class="submit-button" type="submit">
                        <span class="btn-text">Enviar enlace</span>
                        <span class="btn-spinner" hidden></span>
                    </button>
                </div>
            </form>

            <div class="switch-link slide-element">
                <p><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Volver a iniciar sesión</a></p>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>Made with ❤️ by <a href="#" target="_blank">CodeZenithAI</a></p>
    </div>

    <script src="js/standalone.js"></script>
    <script>
        new StandaloneForm({
            formId: 'forgotForm',
            messageForm: 'forgot',
            endpoint: '/api/auth/olvide-password',
            buildBody: (datos) => ({ email: datos.email }),
            onSuccess: (data, form) => {
                form.reset();
            }
        });
    </script>
</body>
</html>
